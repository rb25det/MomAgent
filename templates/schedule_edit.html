{% extends "base.html" %}
{% block title %}予定編集{% endblock %}

{% block content %}
<h2>予定編集</h2>

<form method="POST">
    <label>年-月-日</label>
    <input type="date" name="date" value="{{ item.date }}" required>

    <label>時間</label>
    <input type="time" name="time" value="{{ item.time }}" required>

    <label>内容</label>
    <input type="text" name="content" value="{{ item.content }}" required>

    <label>重要度（1:高 / 2:中 / 3:低）</label>
    <select name="priority">
        <option value="1" {% if item.priority=='1' %}selected{% endif %}>1（高）</option>
        <option value="2" {% if item.priority=='2' %}selected{% endif %}>2（中）</option>
        <option value="3" {% if item.priority=='3' %}selected{% endif %}>3（低）</option>
    </select>

    <label>リマインド回数</label>
    <input type="number" name="remind_value" value="{{ item.remind_value }}">

    <label>リマインド単位</label>
    <select name="remind_unit">
        <option value="hours" {% if item.remind_unit=='hours' %}selected{% endif %}>時間前</option>
        <option value="days" {% if item.remind_unit=='days' %}selected{% endif %}>日前</option>
    </select>

    <button class="primary" type="submit">保存する</button>
</form>
{% endblock %}
