{% extends "base.html" %}
{% block title %}チャット{% endblock %}

{% block content %}
<h2>お母さんAI チャット</h2>

<div id="chat-box" class="chat-box">
    <!-- 既存履歴を出す -->
    {% for m in session.get('chat_history', []) %}
        {% if m.role == 'user' %}
            <div class="bubble user">{{ m.text }}</div>
        {% else %}
            <div class="bubble mom">{{ m.text }}</div>
        {% endif %}
    {% endfor %}
</div>

<div class="chat-input-area">
    <input id="chat-input" placeholder="メッセージを入力..." />
    <button id="send-btn">送信</button>
</div>

<script>
document.getElementById('send-btn').addEventListener('click', async function(){
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if(!text) return;
    appendMessage('user', text);
    input.value = '';

    const res = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message: text})
    });
    const j = await res.json();
    if(j.ok){
        appendMessage('mom', j.reply);
    } else {
        appendMessage('mom', 'ごめん、エラーが起きたみたい。');
    }
});

function appendMessage(role, text){
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = role === 'user' ? 'bubble user' : 'bubble mom';
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
</script>

{% endblock %}
